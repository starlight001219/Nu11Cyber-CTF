name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install flake8 pytest
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat all other issues as warnings
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check Python syntax
      run: |
        python -m py_compile backend/main.py
        python -m py_compile backend/app/__init__.py
        python -m py_compile backend/app/config.py
        python -m py_compile backend/app/crypto.py
        python -m py_compile backend/app/database.py
        python -m py_compile backend/app/models.py
    
    - name: Validate docker-compose.yml
      run: |
        docker compose config
      env:
        SECRET_KEY: ci-dummy-secret-key-for-validation
        MASTER_KEY: ci-dummy-master-key-for-validation
        FLAG_KEY: ci-dummy-flag-key-for-validation

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker images
      run: |
        docker compose build
      env:
        SECRET_KEY: ci-dummy-secret-key-for-validation
        MASTER_KEY: ci-dummy-master-key-for-validation
        FLAG_KEY: ci-dummy-flag-key-for-validation
